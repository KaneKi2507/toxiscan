<!DOCTYPE html>
<html>
<head>
  <title>ToxiScan Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    ul { list-style-type: none; padding: 0; }
    li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 5px; }
    button { margin-left: 10px; cursor: pointer; color: white; background: red; border: none; padding: 5px 10px; border-radius: 3px;}
    .ban-btn { background: darkorange; }
  </style>
</head>
<body>
  <h2>ToxiScan Admin Dashboard</h2>
  
  <h3>Text Logs</h3>
  <ul id="textList"></ul>

  <hr>

  <h3>Ban a User</h3>
  <input type="text" id="usernameInput" placeholder="Enter username">
  <button class="ban-btn" onclick="banUser()">Ban User</button>
  
  <h3>Banned Users</h3>
  <ul id="bannedList"></ul>

  <script>
    async function loadLogs() {
      const res = await fetch("http://127.0.0.1:5000/admin/get_logs");
      const data = await res.json();

      const textList = document.getElementById('textList');
      textList.innerHTML = "";

      data.texts.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>"${item.text}"</strong> 
          <br><small>Scores: ${JSON.stringify(item.prediction)}</small>
          <button onclick="deleteText('${item.text}')">Delete Log</button> 
        `;
        textList.appendChild(li);
      });

      const bannedList = document.getElementById('bannedList');
      bannedList.innerHTML = "";
      data.banned_users.forEach(user => {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${user}</strong>`;
        bannedList.appendChild(li);
      });
    }

    async function deleteText(text) {
      await fetch("http://127.0.0.1:5000/admin/delete_text", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      loadLogs();
    }

    async function banUser() {
      const username = document.getElementById('usernameInput').value;
      if (!username) return;

      await fetch("http://127.0.0.1:5000/admin/ban_user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username })
      });
      
      document.getElementById('usernameInput').value = "";
      alert(`User ${username} has been banned.`);
      loadLogs();
    }

    // Load data when page opens
    loadLogs();
  </script>
</body>
</html>
